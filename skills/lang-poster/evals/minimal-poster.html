<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    .poster {
      position: relative;
      width: 320px;
      height: 400px;
      overflow: hidden;
      padding: 40px;
      color: #111a22;
      background:
        linear-gradient(rgba(107,158,181,.11) 1px, transparent 1px),
        linear-gradient(90deg, rgba(107,158,181,.11) 1px, transparent 1px),
        #fcfeff;
      background-size: 24px 24px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 { margin: 40px 0 20px; font-size: 36px; line-height: 1.15; }
    strong { color: #087cb8; }
    p { font-size: 18px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="poster">
    <small>LANG SKILL / EXPORT TEST</small>
    <h1>先看<strong>判断</strong><br>再画海报</h1>
    <p>输入 → 机制 → 结果</p>
  </main>
</body>
</html>
